site_name: ARTIS
site_description: A 3D Monte Carlo radiative transfer code for supernovae and kilonovae
site_url: https://artis.readthedocs.io/
repo_url: https://github.com/artis-mcrt/artis
repo_name: artis-mcrt/artis
edit_uri: edit/main/docs/
copyright: BSD 3-Clause license

theme:
  name: material
  logo: artislogo.png
  favicon: artislogo.png
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Installation: installation.md
      - Option presets: presets.md
      - Atomic and model data: data.md
  - Running a simulation:
      - Running sn3d: running.md
      - Runs on a cluster: clusters.md
      - Output files: outputfiles.md
      - Post-processing with exspec: exspec.md
  - Reference:
      - Compile-time options: options.md
      - Input files: inputfiles.md
      - Make options: makeoptions.md
      - Bundled scripts: scripts.md
  - Development:
      - Development setup: development.md
      - Testing: testing.md
