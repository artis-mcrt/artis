[workspace]
channels = ["conda-forge"]
name = "artis"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks.make]
cmd = "make --check-symlink-times --jobs=$(nproc --all)"

[dependencies]
openmpi = ">=5.0.8"
gxx = ">=15.1.0"
# clangxx = ">=22.1.0"
# lld = ">=22.1.0"

[activation.env]
OMPI_CXX = "g++"
# OMPI_CXX = "clang++"
