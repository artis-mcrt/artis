---
default_install_hook_types:
    - pre-commit
    - post-checkout
    - post-merge
    - post-rewrite
fail_fast: false
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: [--maxkb=900]
          - id: check-ast
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: check-merge-conflict
          - id: check-yaml
          - id: detect-private-key
          - id: destroyed-symlinks
          - id: end-of-file-fixer
            exclude: ^(third_party/)
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
            args: [--fix=lf]
            exclude: ^(third_party/)
          - id: trailing-whitespace
            exclude: ^(third_party/)
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.5
      hooks:
          - id: ruff-check
            files: ^scripts/.*\.py$
          - id: ruff-format
            files: ^scripts/.*\.py$
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.0
      hooks:
          - id: clang-format
            files: '\.(c|cc|cpp|h|hpp|cxx|hh|inc)$'
            exclude: ^(third_party/)
    - repo: local
      hooks:
          - id: make
            name: make
            entry: make -j OPTIMIZE=OFF
            language: system
            pass_filenames: false
            # a commit that changes no source file and no build file needs no compile.
            # pre-commit skips a hook when no file matches, also with pass_filenames: false
            files: '(\.(c|cc|cpp|h|hpp|cxx|hh|inc)$|^Makefile$)'
ci:
    skip: [make]
