---
default_install_hook_types:
    - pre-commit
    - post-checkout
    - post-merge
    - post-rewrite
fail_fast: false
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: [--maxkb=900]
          - id: check-ast
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: check-merge-conflict
          - id: check-yaml
          - id: detect-private-key
          - id: destroyed-symlinks
          - id: end-of-file-fixer
            exclude: ^(third_party/)
          - id: fix-byte-order-marker
          - id: forbid-new-submodules
          - id: mixed-line-ending
            args: [--fix=lf]
            exclude: ^(third_party/)
          - id: trailing-whitespace
            exclude: ^(third_party/)
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.2
      hooks:
          - id: ruff-check
            files: ^scripts/.*\.py$
          - id: ruff-format
            files: ^scripts/.*\.py$
    # the type checkers and their versions agree with artistools. A dependency of a script goes into the environment of
    # both hooks, so that the checkers can resolve its imports. The hooks share this environment
    - repo: local
      hooks:
          - id: pyrefly
            name: pyrefly
            entry: pyrefly check --config scripts/pyrefly.toml
            language: python
            language_version: python3.14
            additional_dependencies: [pyrefly==1.4.0, ty==0.0.89]
            pass_filenames: false
            require_serial: true
            files: ^scripts/(.*\.py|pyrefly\.toml)$
          - id: ty
            name: ty
            entry: ty check --config-file scripts/ty.toml scripts
            language: python
            language_version: python3.14
            additional_dependencies: [pyrefly==1.4.0, ty==0.0.89]
            pass_filenames: false
            require_serial: true
            files: ^scripts/(.*\.py|ty\.toml)$
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v23.1.3
      hooks:
          - id: clang-format
            files: '\.(c|cc|cpp|h|hpp|cxx|hh|inc)$'
            exclude: ^(third_party/)
    - repo: local
      hooks:
          - id: make
            name: make
            entry: make -j OPTIMIZE=OFF
            language: system
            pass_filenames: false
            # a commit that changes no source file and no build file needs no compile.
            # pre-commit skips a hook when no file matches, also with pass_filenames: false
            files: '(\.(c|cc|cpp|h|hpp|cxx|hh|inc)$|^Makefile$)'
ci:
    # pre-commit.ci has no Python 3.14 for the type checkers. The workflow ci-checks.yml runs them
    skip: [make, pyrefly, ty]
