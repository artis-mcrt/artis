---
name: CI
permissions:
  contents: read
on:
    push:
        branches-ignore:
            - classic*
    merge_group:
    schedule:
        - cron: 0 13 * * 1
    workflow_dispatch:
    workflow_call: # for triggering the full test mode
        inputs:
            # test mode enables the santizers and additional assertions
            testmode:
                required: false
                default: 'OFF'
                type: string
            uploadoutputfiles:
                required: false
                default: 'OFF'
                type: string
env:
    ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=0

jobs:
    testmodels:
        strategy:
            matrix:
                testname:
                    [
                        classicmode_1d_3dgrid,
                        classicmode_3d,
                        kilonova_1d,
                        kilonova_1d_timedepnlte,
                        kilonova_2d,
                        kilonova_2d_barnesthermalisation,
                        kilonova_2d_expansionopac,
                        kilonova_2d_xcomgammaphotoion,
                        nebular_1d_3dgrid,
                        nebular_1d_3dgrid_limitbfest,
                        nltephotospheric_dynamic_ion_range_1d_1dgrid,
                    ]
            fail-fast: ${{ inputs.testmode == 'ON' }}

        runs-on: ubuntu-26.04-arm
        timeout-minutes: ${{ inputs.testmode == 'ON' && 360 || 40 }}
        name: ${{ matrix.testname }}
        env:
            OMPI_MCA_memory: ${{ inputs.testmode == 'ON' && '^patcher' || '' }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Open MPI and set compiler to g++-15
              run: |
                  echo "CXX=g++-15" >> $GITHUB_ENV
                  echo "OMPI_CXX=g++-15" >> $GITHUB_ENV
                  sudo apt-get update
                  sudo apt-get install -y openmpi-bin libopenmpi-dev

            - name: Show CPU type and core count
              id: cpu-count
              run: |
                  g++ -march=native -Q --help=target | grep -- '-march=  ' | cut -f3
                  python3 -c 'import multiprocessing; print(f"CPU count: {multiprocessing.cpu_count()}")'
                  echo "count=$(python3 -c 'import multiprocessing; print(multiprocessing.cpu_count())')" >> $GITHUB_OUTPUT

            - name: Cache test atomic data
              if: ${{ !startsWith(matrix.testname, 'classicmode') }}
              uses: actions/cache@v6
              id: cache-testatomicdata
              with:
                  path: tests/atomicdata_feconi.tar.xz
                  key: tests/atomicdata_feconi.tar.xz

            - name: Cache test atomic data classic
              if: ${{ startsWith(matrix.testname, 'classicmode') }}
              uses: actions/cache@v6
              id: cache-testatomicdata-classic
              with:
                  path: tests/atomicdata_classic.tar.xz
                  key: tests/atomicdata_classic.tar.xz

            - name: Cache test atomic data nltephotospheric
              if: ${{ startsWith(matrix.testname, 'nltephotospheric') }}
              uses: actions/cache@v6
              id: cache-testatomicdata-nltephotospheric
              with:
                  path: tests/atomicdata_hefeconi_fe_i_to_vii.tar.xz
                  key: tests/atomicdata_hefeconi_fe_i_to_vii.tar.xz

            - name: Cache test atomic data kilonova_1d_timedepnlte
              if: ${{ startsWith(matrix.testname, 'kilonova_1d_timedepnlte') }}
              uses: actions/cache@v6
              id: cache-testatomicdata-sryzrlace
              with:
                  path: tests/atomicdata_sryzrlace.tar.zst
                  key: tests/atomicdata_sryzrlace.tar.zst

            - name: Download/extract test data
              working-directory: tests/
              run: |
                  source ./setup_${{ matrix.testname }}.sh

            - name: cat artisoptions.h
              run: |
                  cp tests/${{ matrix.testname }}_testrun/artisoptions.h .
                  cat artisoptions.h

            - name: Compile
              run: |
                  make REPRODUCIBLE=ON TESTMODE=${{ inputs.testmode }} MAX_NODE_SIZE=2 FASTMATH=OFF -j${{ steps.cpu-count.outputs.count }} sn3d exspec
                  cp sn3d tests/${{ matrix.testname }}_testrun/
                  cp exspec tests/${{ matrix.testname }}_testrun/

            - name: Run test job0 start
              id: run_job0
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  rm -f input.txt
                  time mpirun -np 4 --oversubscribe --mca osc ^ucx --mca mpi_yield_when_idle 1 ./sn3d -o job0

            - name: cat job0 estimators
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: cat job0/estimators*.out

            - name: cat job0 output log
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: cat job0/output_0-0.txt

            - name: Checksum job0 output files
              if: always()
              continue-on-error: ${{ inputs.testmode == 'ON' }}
              working-directory: tests/${{ matrix.testname }}_testrun
              run: |
                  # The marker file shows that the run step succeeded and that md5sum wrote the
                  # full checksum file. The "Update checksums" workflow accepts only an artifact
                  # with the markers. A checksum mismatch below still permits the marker, because
                  # the mismatch is the reason to update the stored checksums.
                  # Some tests write no speclc_angle_res files, so that glob can expand to nothing.
                  set -o pipefail
                  shopt -s nullglob
                  angleresfiles=(speclc_angle_res/*.*)
                  shopt -u nullglob
                  md5sum *.out job0/*.out "${angleresfiles[@]}" | tee ../${{ matrix.testname }}_inputfiles/results_md5_job0.txt
                  if [ "${{ steps.run_job0.outcome }}" = "success" ]; then
                      touch ../${{ matrix.testname }}_inputfiles/results_md5_job0.txt.complete
                  else
                      echo "The step writes no marker. The sn3d job0 step did not succeed (${{ steps.run_job0.outcome }})."
                  fi
                  if [ -f results_md5_job0.txt ]; then md5sum -c results_md5_job0.txt; else echo "results_md5_job0.txt not found"; fi

            - name: Run test job1 resume
              id: run_job1
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  cp input-resume.txt input.txt
                  time mpirun -np 4 --oversubscribe --mca osc ^ucx --mca mpi_yield_when_idle 1 ./sn3d -o job1

            - name: Remove restart files
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: rm *.tmp

            - name: cat job1 estimators
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: cat job1/estimators*.out

            - name: cat job1 output log
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: cat job1/output_0-0.txt

            - name: show deposition.out
              if: always() && inputs.testmode != 'ON'
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  cat deposition.out

            - name: Show CPU core time
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  python3 ../../scripts/sumcorehourslogs.py

            - name: Run exspec
              id: run_exspec
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  time mpirun -np 1 --mca osc ^ucx ./exspec
                  python3 ../../scripts/mergeangleres.py
                  rm -f light_curve_res_*.out spec_res_*.out specpol_res_*.out

            - name: cat exspec log
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun/
              run: |
                  mkdir output
                  cat exspec.txt

            - name: Checksum job1 output files
              if: always()
              continue-on-error: ${{ inputs.testmode == 'ON' }}
              working-directory: tests/${{ matrix.testname }}_testrun
              run: |
                  # The marker file shows that the run steps succeeded and that md5sum wrote the
                  # full checksum file. The "Update checksums" workflow accepts only an artifact
                  # with the markers. A checksum mismatch below still permits the marker, because
                  # the mismatch is the reason to update the stored checksums.
                  # Some tests write no speclc_angle_res files, so that glob can expand to nothing.
                  set -o pipefail
                  shopt -s nullglob
                  angleresfiles=(speclc_angle_res/*.*)
                  shopt -u nullglob
                  md5sum *.out job1/*.out "${angleresfiles[@]}" | tee ../${{ matrix.testname }}_inputfiles/results_md5_final.txt
                  if [ "${{ steps.run_job0.outcome }}" = "success" ] && [ "${{ steps.run_job1.outcome }}" = "success" ] && [ "${{ steps.run_exspec.outcome }}" = "success" ]; then
                      touch ../${{ matrix.testname }}_inputfiles/results_md5_final.txt.complete
                  else
                      echo "The step writes no marker. A run step did not succeed (job0: ${{ steps.run_job0.outcome }}, job1: ${{ steps.run_job1.outcome }}, exspec: ${{ steps.run_exspec.outcome }})."
                  fi
                  if [ -f results_md5_final.txt ]; then md5sum -c results_md5_final.txt; else echo "results_md5_final.txt not found"; fi

            - name: Prepare for next steps
              if: always()
              working-directory: tests/${{ matrix.testname }}_testrun
              run: |
                  find . -name "*_res_*.out" -exec zstd -v -T0 --rm -f {} \;

            - name: Upload output files
              uses: actions/upload-artifact@v7
              if: always() && inputs.testmode != 'ON' && inputs.uploadoutputfiles == 'ON'
              with:
                  name: test-${{ matrix.testname }}-output
                  path: tests/${{ matrix.testname }}_testrun

            - name: Upload checksum files
              uses: actions/upload-artifact@v7
              if: always() && inputs.testmode != 'ON'
              with:
                  name: ${{ matrix.testname }}_inputfiles
                  path: tests/${{ matrix.testname }}_inputfiles/results_md5*

            - name: Setup uv
              uses: astral-sh/setup-uv@v10.0.1
              if: always() && inputs.testmode != 'ON'
              id: setup-uv
              with:
                enable-cache: "false"

            - name: Install artistools
              if: always() && inputs.testmode != 'ON'
              run: |
                  uv tool install artistools@latest

            - name: Plot light curve
              if: always() && inputs.testmode != 'ON'
              working-directory: tests/
              run: |
                  artistools plotlightcurves ${{ matrix.testname }}_testrun
                  artistools plotlightcurves --frompackets ${{ matrix.testname }}_testrun

            - name: Plot spectrum nebular
              if: always() && inputs.testmode != 'ON' && startsWith(matrix.testname, 'nebular')
              working-directory: tests/
              run: |
                  artistools plotspectra --frompackets -t 200 ${{ matrix.testname }}_testrun

            - name: Plot spectrum classicmode
              if: always() && inputs.testmode != 'ON' && startsWith(matrix.testname, 'classicmode_')
              working-directory: tests/
              run: |
                  artistools plotspectra --frompackets -t 4-6 ${{ matrix.testname }}_testrun

            - name: Plot virtual packet spectrum classicmode_1d
              if: always() && inputs.testmode != 'ON' && startsWith(matrix.testname, 'classicmode_1d')
              working-directory: tests/
              run: |
                  artistools plotspectra -t 4-6 -plotvspecpol 0 1 2 3 12 13 14 -- ${{ matrix.testname }}_testrun
                  artistools plotspectra -t 4-6 -plotvspecpol 0 1 2 3 12 13 14 --frompackets ${{ matrix.testname }}_testrun

            - name: Plot virtual packet spectrum classicmode_3d
              if: always() && inputs.testmode != 'ON' && startsWith(matrix.testname, 'classicmode_3d')
              working-directory: tests/
              run: |
                  artistools plotspectra -t 4-6 -plotvspecpol 0 1 2 -- ${{ matrix.testname }}_testrun
                  artistools plotspectra -t 4-6 -plotvspecpol 0 1 2 --frompackets ${{ matrix.testname }}_testrun

            - name: Plot spectrum kilonova
              if: always() && inputs.testmode != 'ON' && startsWith(matrix.testname, 'kilonova')
              working-directory: tests/
              run: |
                  artistools plotspectra --frompackets -t ${{ startsWith(matrix.testname, 'kilonova_1d_timedepnlte') && '8.5' || '1.5' }} ${{ matrix.testname }}_testrun

            - name: Upload plot files
              if: always() && inputs.testmode != 'ON' && inputs.uploadoutputfiles == 'ON'
              uses: actions/upload-artifact@v7
              with:
                  name: test-${{ matrix.testname }}-output-pdf
                  path: tests/*.pdf

    # Runs one small model with OpenMP threading to exercise the mutex/atomic code paths that the
    # single-threaded checksum tests never enter. No checksum comparison: multithreaded runs are not
    # reproducible (worker threads have independently seeded generators and race on shared estimators).
    openmp_smoke:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: ${{ inputs.testmode == 'ON' && 360 || 40 }}
        name: kilonova_1d_openmp_nochecksums
        env:
            OMPI_MCA_memory: ${{ inputs.testmode == 'ON' && '^patcher' || '' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Open MPI and set compiler to g++-15
              run: |
                  echo "CXX=g++-15" >> $GITHUB_ENV
                  echo "OMPI_CXX=g++-15" >> $GITHUB_ENV
                  sudo apt-get update
                  sudo apt-get install -y openmpi-bin libopenmpi-dev

            - name: Cache test atomic data
              uses: actions/cache@v6
              id: cache-testatomicdata
              with:
                  path: tests/atomicdata_feconi.tar.xz
                  key: tests/atomicdata_feconi.tar.xz

            - name: Download/extract test data
              working-directory: tests/
              run: |
                  source ./setup_kilonova_1d.sh

            - name: Compile
              run: |
                  cp tests/kilonova_1d_testrun/artisoptions.h .
                  make OPENMP=ON TESTMODE=${{ inputs.testmode }} MAX_NODE_SIZE=2 FASTMATH=OFF -j$(nproc) sn3d exspec
                  cp sn3d exspec tests/kilonova_1d_testrun/

            - name: Run test job0 with OpenMP threads
              working-directory: tests/kilonova_1d_testrun/
              env:
                  OMP_NUM_THREADS: 2
              run: |
                  rm -f input.txt
                  time mpirun -np 2 --oversubscribe --mca osc ^ucx --mca mpi_yield_when_idle 1 ./sn3d -o job0

            - name: cat output log
              if: always()
              working-directory: tests/kilonova_1d_testrun/
              run: cat job0/output_0-0.txt

    # Runs the same small model with C++ standard parallelism on multicore CPUs (no GPU offload), which
    # reaches the same shared-state code paths as the OpenMP job but through std::execution::par_unseq and
    # std::atomic_ref instead of OpenMP pragmas. As for the OpenMP job, there is no checksum comparison
    # because multithreaded runs are not reproducible. The thread count is whatever libtbb picks from the
    # runner's hardware concurrency: unlike OpenMP there is no environment variable to cap it.
    stdpar_smoke:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: ${{ inputs.testmode == 'ON' && 360 || 40 }}
        name: kilonova_1d_stdpar_nochecksums
        env:
            OMPI_MCA_memory: ${{ inputs.testmode == 'ON' && '^patcher' || '' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install Open MPI and TBB and set compiler to g++-15
              run: |
                  echo "CXX=g++-15" >> $GITHUB_ENV
                  echo "OMPI_CXX=g++-15" >> $GITHUB_ENV
                  sudo apt-get update
                  sudo apt-get install -y openmpi-bin libopenmpi-dev libtbb-dev

            - name: Cache test atomic data
              uses: actions/cache@v6
              id: cache-testatomicdata
              with:
                  path: tests/atomicdata_feconi.tar.xz
                  key: tests/atomicdata_feconi.tar.xz

            - name: Download/extract test data
              working-directory: tests/
              run: |
                  source ./setup_kilonova_1d.sh

            - name: Compile
              run: |
                  cp tests/kilonova_1d_testrun/artisoptions.h .
                  make STDPAR=ON TESTMODE=${{ inputs.testmode }} MAX_NODE_SIZE=2 FASTMATH=OFF -j$(nproc) sn3d exspec
                  cp sn3d exspec tests/kilonova_1d_testrun/

            - name: Run test job0 with stdpar threads
              working-directory: tests/kilonova_1d_testrun/
              run: |
                  rm -f input.txt
                  time mpirun -np 2 --oversubscribe --mca osc ^ucx --mca mpi_yield_when_idle 1 ./sn3d -o job0

            - name: cat output log
              if: always()
              working-directory: tests/kilonova_1d_testrun/
              run: cat job0/output_0-0.txt

    combine_checksums:
        needs: testmodels
        if: always() && inputs.testmode != 'ON'
        runs-on: ubuntu-26.04-arm
        steps:
            - name: Download test output
              uses: actions/download-artifact@v8

            - name: Upload bundled checksum files
              uses: actions/upload-artifact@v7
              with:
                  name: checksums
                  # Include the .complete markers, which the "Update checksums" workflow requires.
                  path: '*_inputfiles/results_md5*'
