---
name: Compile and lint
permissions:
  contents: read
on:
    push:
        branches-ignore:
            - classic*
    workflow_dispatch:

jobs:
    # clang-format:
    #     runs-on: ubuntu-24.04
    #     steps:
    #         - uses: actions/checkout@v6

    #         - name: Run clang-format style check
    #           uses: jidicula/clang-format-action@v4.16.0
    #           with:
    #               clang-format-version: '21'
    #               check-path: .

    clang-tidy-cppcheck:
        name: clang-format, clang-tidy, and cppcheck
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest-stable'

            - name: Install dependencies
              run: |
                  brew update
                  brew install llvm
                  echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

                  echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
                  echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV

                  echo "CXXFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV

                  echo "LIBRARY_PATH=/opt/homebrew/opt/lib" >> $GITHUB_ENV
                  echo "LD_LIBRARY_PATH=/opt/homebrew/opt/lib" >> $GITHUB_ENV
                  echo "CPATH=$HOMEBREW_PREFIX/include:$CPATH" >> $GITHUB_ENV

                  brew install openmpi gsl cppcheck || true
                  python3 -m pip install compiledb

            - name: Generate compile_commands.json
              run: |
                  cp artisoptions_nltenebular.h artisoptions.h
                  make clean
                  python3 -m compiledb -n --full-path make TESTMODE=ON

            - name: Run pre-commit hooks
              uses: j178/prek-action@v1

            - name: Run clang-tidy
              run: |
                  clang-tidy --version
                  xcrun run-clang-tidy

            - name: Run cppcheck
              run: |
                  cppcheck --version
                  cppcheck --force --error-exitcode=1 --language=c++ -i third_party --enable=all --inconclusive --inline-suppr --suppress=knownConditionTrueFalse --suppress=constParameterCallback --suppress=redundantAssignment --suppress=knownArgument --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=useStlAlgorithm --check-level=exhaustive .

    compile:
        strategy:
            matrix:
                compiler:
                    [
                        {name: gcc, ver: 13},
                        {name: gcc, ver: 14},
                        {name: gcc, ver: 15},
                        {name: clang, ver: 21},
                        {name: nvc++, ver: '26.1'},
                    ]
            fail-fast: false

        runs-on: ubuntu-24.04
        name: Ubuntu ${{ matrix.compiler.name }} ${{ matrix.compiler.ver }}
        steps:
            - uses: actions/checkout@v6

            - name: Show CPU type and core count
              id: cpu-count
              run: |
                  g++ -march=native -Q --help=target | grep -- '-march=  ' | cut -f3
                  python3 -c 'import multiprocessing; print(f"CPU count: {multiprocessing.cpu_count()}")'
                  echo "count=$(python3 -c 'import multiprocessing; print(multiprocessing.cpu_count())')" >> $GITHUB_OUTPUT

            - name: Cache gcc build
              id: cache-gcc
              if: matrix.compiler.name == 'gcc' && matrix.compiler.ver == 15
              uses: actions/cache@v5
              with:
                  path: /opt/gcc-15
                  key: gcc-${{ matrix.compiler.ver }}-${{ runner.os }}-${{ hashFiles('/opt/gcc-15/**/ChangeLog', '/opt/gcc-15/**/Makefile') }}
                  restore-keys: gcc-${{ matrix.compiler.ver }}-${{ runner.os }}-

            - name: Compile gcc-15
              # gcc-15 is not available until Ubuntu 26.04
              if: matrix.compiler.name == 'gcc' && matrix.compiler.ver == 15 && steps.cache-gcc.outputs.cache-hit != 'true'
              run: |
                  sudo apt install -y build-essential git make gawk flex bison libgmp-dev libmpfr-dev libmpc-dev python3 binutils perl libisl-dev libzstd-dev tar gzip bzip2
                  export CONFIG_SHELL=/bin/bash
                  mkdir ~/gcc-15
                  cd ~/gcc-15
                  git clone https://gcc.gnu.org/git/gcc.git gcc-15-source
                  cd gcc-15-source
                  git checkout releases/gcc-15
                  ./contrib/download_prerequisites
                  cd ~/gcc-15
                  mkdir gcc-15-build
                  cd gcc-15-build
                  ../gcc-15-source/configure --prefix=/opt/gcc-15 --disable-multilib --enable-languages=c++
                  make -j$(nproc)
                  sudo make install

            - name: Add g++ symlink
              if: matrix.compiler.name == 'gcc' && matrix.compiler.ver == 15
              run: |
                  sudo update-alternatives --install /usr/bin/g++ g++ /opt/gcc-15/bin/g++ 100
                  sudo ln -s /opt/gcc-15/bin/g++ /usr/bin/g++-15

            - name: Select GCC version as default C++ compiler
              if: matrix.compiler.name == 'gcc'
              run: |
                  echo "CXX=g++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "OMPI_CXX=g++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV

            - name: Install Clang ${{ matrix.compiler.ver }}
              if: matrix.compiler.name == 'clang'
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh ${{ matrix.compiler.ver }}
                  sudo apt-get install libc++-${{ matrix.compiler.ver }}* libc++abi-${{ matrix.compiler.ver }}* -y --no-install-recommends
                  sudo apt-get update
                  sudo apt-get upgrade
                  sudo apt-get install -y lld-${{ matrix.compiler.ver }} clang-${{ matrix.compiler.ver }} libomp-${{ matrix.compiler.ver }}-dev
                  echo "CXX=clang++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "OMPI_CXX=clang++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "LDFLAGS=-L/usr/lib/llvm-${{ matrix.compiler.ver }}/lib" >> $GITHUB_ENV

            - name: Install nvc++
              if: matrix.compiler.name == 'nvc++'
              uses: fortran-lang/setup-fortran@v1.8.1
              with:
                  compiler: nvidia-hpc
                  version: ${{ matrix.compiler.ver }}

            - name: Set nvc++ as compiler
              if: matrix.compiler.name == 'nvc++'
              run: |
                  echo "CXX=nvc++" >> $GITHUB_ENV
                  echo "OMPI_CXX=nvc++" >> $GITHUB_ENV

            - name: Install GSL
              run: |
                  sudo apt-get update
                  sudo apt install -y libgsl-dev

            - name: Install TBB
              if: matrix.compiler.name == 'gcc'
              run: |
                  sudo apt install libtbb-dev

            - name: Install OpenMPI
              run: |
                  sudo apt install -y openmpi-bin libopenmpi-dev

            - name: Compile classic mode STDPAR=ON GPU=ON
              if: matrix.compiler.name == 'nvc++'
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile classic mode OPENMP=ON
              run: |
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile classic mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile nebular mode BOOST=OFF EIGEN=OFF
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} BOOST=OFF EIGEN=OFF sn3d exspec

            - name: Compile nebular mode OPENMP=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile nebular mode STDPAR=ON
              if: matrix.compiler.name != 'nvc++'
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile nebular mode STDPAR=ON GPU=ON
              if: matrix.compiler.name == 'nvc++'
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile all remaining option files
              run: |
                  for file in $(find . -name "artisoptions_*.h" ! -name "artisoptions_classic.h" ! -name "artisoptions_nltenebular.h"); do
                      cp -v -p "$file" artisoptions.h
                      make sn3d
                  done

    mac-clang:
        runs-on: macos-26
        name: Apple Clang and LLVM Clang
        steps:
            - uses: actions/checkout@v6

            - name: Show CPU Core Count
              id: cpu-count
              run: |
                  python3 -c 'import multiprocessing; print(f"CPU count: {multiprocessing.cpu_count()}")'
                  echo "count=$(python3 -c 'import multiprocessing; print(multiprocessing.cpu_count())')" >> $GITHUB_OUTPUT

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest-stable'

            - name: Install GSL and OpenMPI
              run: |
                  brew update
                  brew install gsl openmpi || true

            - name: Install OpenMP
              run: |
                  brew install libomp || true
                  brew link --force libomp

                  echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib $LDFLAGS" >> $GITHUB_ENV
                  echo "CXXFLAGS=-I/opt/homebrew/opt/libomp/include $CXXFLAGS" >> $GITHUB_ENV

            - name: Apple Clang Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile classic mode OPENMP=ON
              run: |
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile classic mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile nebular mode OPENMP=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile nebular mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Apple Clang Compile all remaining option files
              run: |
                  for file in $(find . -name "artisoptions_*.h" ! -name "artisoptions_classic.h" ! -name "artisoptions_nltenebular.h"); do
                      cp -v -p "$file" artisoptions.h
                      make sn3d
                  done

            - name: Install LLVM
              run: |
                  brew install llvm || true
                  echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
                  echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib -L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib/unwind -lunwind" >> $GITHUB_ENV
                  echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
                  echo "CXX=clang++" >> $GITHUB_ENV

            - name: LLVM Clang Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile classic mode OPENMP=ON
              run: |
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile classic mode STDPAR=ON
              run: |
                  clang++ -v
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile nebular mode boost+eigen
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j${{ steps.cpu-count.outputs.count}} BOOST=ON EIGEN=ON sn3d exspec

            - name: LLVM Clang Compile nebular mode OPENMP=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make OPENMP=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile nebular mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: LLVM Clang Compile all remaining option files
              run: |
                  for file in $(find . -name "artisoptions_*.h" ! -name "artisoptions_classic.h" ! -name "artisoptions_nltenebular.h"); do
                      cp -v -p "$file" artisoptions.h
                      make sn3d
                  done

    amd-rocm-hipcc:
        runs-on: ubuntu-24.04
        name: AMD ROCm hipcc
        container:
            image: rocm/dev-ubuntu-24.04:7.2-complete
        steps:
            - name: Show CPU type and core count
              id: cpu-count
              run: |
                  g++ -march=native -Q --help=target | grep -- '-march=  ' | cut -f3
                  python3 -c 'import multiprocessing; print(f"CPU count: {multiprocessing.cpu_count()}")'
                  echo "count=$(python3 -c 'import multiprocessing; print(multiprocessing.cpu_count())')" >> $GITHUB_OUTPUT

            - name: Set MPI host compiler to hipcc
              run: |
                  hipcc --version
                  echo "hipconfig:"
                  hipconfig --version
                  echo "CXX=hipcc" >> $GITHUB_ENV
                  echo "OMPI_CXX=hipcc" >> $GITHUB_ENV
                  echo "ROCM_PATH=/opt/rocm-7.2.0" >> $GITHUB_ENV

            - name: Install OpenMPI and git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libopenmpi-dev openmpi-bin
                  sudo apt-get install -y git

            - uses: actions/checkout@v6
              with:
                    fetch-depth: 0

            - name: Compile classic mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec

            - name: Compile nebular mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j${{ steps.cpu-count.outputs.count}} sn3d exspec
