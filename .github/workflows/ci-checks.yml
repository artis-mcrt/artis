---
name: Compile and lint
permissions:
  contents: read
on:
    push:
        branches-ignore:
            - classic*
    merge_group:
    schedule:
        - cron: 0 13 * * 1
    workflow_dispatch:

jobs:
    clang-format-tidy:
        name: Format and lint
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7

            - name: Run pre-commit hooks
              uses: j178/prek-action@v2
              if: always()
              with:
                extra-args: '--all-files --skip make'

            - name: Setup uv
              if: always()
              uses: astral-sh/setup-uv@v9.0.0
              id: setup-uv
              with:
                enable-cache: "false"

            - name: Install dependencies
              if: always()
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh 22
                  sudo apt-get install -y clang-tidy-22 libc++-22-dev libc++abi-22-dev openmpi-bin libopenmpi-dev
                  echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH
                  echo "OMPI_CXX=/usr/lib/llvm-22/bin/clang++" >> $GITHUB_ENV
                  echo "LIBCXX=/usr/lib/llvm-22/include/c++/v1" >> $GITHUB_ENV
                  cp artisoptions_nltenebular.h artisoptions.h

            - name: Generate compile database
              if: always()
              run: |
                  make clean
                  uvx compiledb -n --full-path make TESTMODE=ON

            - name: Run clang-tidy
              if: always()
              run: |
                  clang-tidy --version
                  # mpicxx is a wrapper, so the compile DB carries no MPI include path;
                  # feed clang-tidy the same dirs mpicxx would add, or <mpi.h> isn't found.
                  mpiargs=""
                  for d in $(mpicxx --showme:incdirs); do mpiargs="$mpiargs -extra-arg=-isystem$d"; done
                  run-clang-tidy -extra-arg=-nostdinc++ -extra-arg=-isystem"$LIBCXX" $mpiargs

    cppcheck:
        name: Lint with cppcheck
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7

            - name: Install dependencies
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  brew update
                  brew install cppcheck
                  echo "$(brew --prefix cppcheck)/bin" >> $GITHUB_PATH
                  cp artisoptions_nltenebular.h artisoptions.h
                  make clean

            - name: Run cppcheck
              run: |
                  cppcheck --version
                  cppcheck --force --error-exitcode=1 --language=c++ -i third_party --enable=all --inconclusive --inline-suppr --suppress=knownConditionTrueFalse --suppress=redundantAssignment --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=useStlAlgorithm --check-level=exhaustive  -U__NVCOMPILER .

    compile:
        strategy:
            matrix:
                compiler:
                    [
                        {name: gcc, ver: 14},
                        {name: gcc, ver: 15},
                        {name: gcc, ver: 16},
                        {name: clang, ver: 22},
                    ]
            fail-fast: false

        runs-on: ubuntu-26.04
        name: Ubuntu ${{ matrix.compiler.name }} ${{ matrix.compiler.ver }}
        steps:
            - uses: actions/checkout@v7

            - name: Install gcc
              if: matrix.compiler.name == 'gcc' && matrix.compiler.ver >= 16
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends software-properties-common
                  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends gcc-${{ matrix.compiler.ver }} g++-${{ matrix.compiler.ver }}
                  sudo update-alternatives \
                        --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.compiler.ver }} 100 \
                        --slave /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.compiler.ver }}

            - name: Set default C++ compiler to gcc version
              if: matrix.compiler.name == 'gcc'
              run: |
                  echo "CXX=g++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "OMPI_CXX=g++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV

            - name: Install clang
              if: matrix.compiler.name == 'clang'
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh ${{ matrix.compiler.ver }}
                  sudo apt-get install -y --no-install-recommends lld-${{ matrix.compiler.ver }} clang-${{ matrix.compiler.ver }} libomp-${{ matrix.compiler.ver }}-dev
                  echo "CXX=clang++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "OMPI_CXX=clang++-${{ matrix.compiler.ver }}" >> $GITHUB_ENV
                  echo "LDFLAGS=-L/usr/lib/llvm-${{ matrix.compiler.ver }}/lib" >> $GITHUB_ENV

            - name: Install Open MPI
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev

            - name: Install TBB
              if: matrix.compiler.name == 'gcc'
              run: |
                  sudo apt-get install -y --no-install-recommends libtbb-dev

            - name: Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: Build and run unit tests (classic mode)
              run: |
                  make -j$(nproc) unittests
                  ./unittests

            - name: Compile classic mode OPENMP=ON
              run: |
                  make clean
                  make OPENMP=ON -j$(nproc) sn3d exspec

            - name: Compile classic mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: Build and run unit tests (nebular mode)
              run: |
                  make -j$(nproc) unittests
                  ./unittests

            - name: Compile nebular mode OPENMP=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make OPENMP=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j$(nproc) sn3d exspec

            - name: Compile all remaining option files
              run: |
                  # no -p: a preserved (older) mtime would make the preset build look already up to date
                  for file in $(find . -name "artisoptions_*.h" ! -name "artisoptions_classic.h" ! -name "artisoptions_nltenebular.h"); do
                      cp -v "$file" artisoptions.h
                      make -j$(nproc) sn3d
                  done

    mac-clang:
        runs-on: macos-26
        name: Apple Clang and LLVM Clang
        steps:
            - uses: actions/checkout@v7

            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: 'latest-stable'

            - name: Install Open MPI and OpenMP
              run: |
                  brew update
                  brew install coreutils openmpi libomp
                  brew link --force libomp

                  echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib $LDFLAGS" >> $GITHUB_ENV
                  echo "CXXFLAGS=-I/opt/homebrew/opt/libomp/include $CXXFLAGS" >> $GITHUB_ENV

            - name: Apple Clang Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: Apple Clang Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: Install LLVM
              run: |
                  brew install llvm lld
                  echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
                  echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib -L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib/unwind -lunwind" >> $GITHUB_ENV
                  echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
                  echo "CXX=clang++" >> $GITHUB_ENV

            - name: LLVM Clang Compile classic mode
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile classic mode OPENMP=ON
              run: |
                  make clean
                  make OPENMP=ON -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile classic mode STDPAR=ON
              run: |
                  clang++ -v
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile nebular mode OPENMP=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make OPENMP=ON -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile nebular mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j$(nproc) sn3d exspec

            - name: LLVM Clang Compile all remaining option files
              run: |
                  # no -p: a preserved (older) mtime would make the preset build look already up to date
                  for file in $(find . -name "artisoptions_*.h" ! -name "artisoptions_classic.h" ! -name "artisoptions_nltenebular.h"); do
                      cp -v "$file" artisoptions.h
                      make -j$(nproc) sn3d
                  done

    amd-rocm-hipcc:
        runs-on: ubuntu-24.04
        name: AMD ROCm hipcc
        container:
            image: rocm/dev-ubuntu-24.04:7.2.3-complete
        steps:
            - uses: actions/checkout@v7
              with:
                    fetch-depth: 0

            - name: Install gcc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends software-properties-common
                  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends gcc-14 g++-14
                  sudo update-alternatives \
                       --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                       --slave /usr/bin/g++ g++ /usr/bin/g++-14

            - name: Set MPI compiler to hipcc
              run: |
                  hipcc --version
                  hipconfig
                  echo "CXX=hipcc" >> $GITHUB_ENV
                  echo "OMPI_CXX=hipcc" >> $GITHUB_ENV
                  echo "ROCM_PATH=$(hipconfig --rocmpath)" >> $GITHUB_ENV

            - name: Install Open MPI and git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libopenmpi-dev openmpi-bin git
                  git config --global --add safe.directory /__w/artis/artis

            - name: Compile classic mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec

    nvidia-nvhpc:
        name: NVIDIA NVHPC nvc++
        runs-on: ubuntu-26.04
        # NVIDIA's container registry serves the SDK preinstalled, avoiding the apt repository on
        # developer.download.nvidia.com, which (as of 2026-07) returns 404 for the SDK debs when
        # fetched from GitHub's runner network (same approach as the AMD ROCm job above).
        # 26.1 is the previously-validated SDK version: 26.5's bundled stdexec headers fail to
        # compile with its own frontend in -stdpar=gpu mode ("operator= has already been declared"
        # in include-stdexec/stdexec/__detail/__any.hpp)
        container:
            image: nvcr.io/nvidia/nvhpc:26.1-devel-cuda13.1-ubuntu24.04
        steps:
            - uses: actions/checkout@v7
              with:
                    fetch-depth: 0

            - name: Install gcc
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends software-properties-common
                  add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  apt-get update
                  # gfortran-14 completes the toolchain that nvc++ validates when passed --gcc-toolchain
                  apt-get install -y --no-install-recommends gcc-14 g++-14 gfortran-14
                  update-alternatives \
                       --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
                       --slave /usr/bin/g++ g++ /usr/bin/g++-14

            - name: Set nvc++ as compiler
              run: |
                  nvc++ --version
                  echo "CXX=nvc++" >> $GITHUB_ENV
                  echo "OMPI_CXX=nvc++" >> $GITHUB_ENV
                  # make nvc++ use the gcc-14 toolchain (the image's preconfigured system gcc is older)
                  echo "GCCTOOLCHAIN=$(which g++-14)" >> $GITHUB_ENV

            - name: Install Open MPI and git
              run: |
                  apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev git
                  git config --global --add safe.directory /__w/artis/artis

            - name: Compile classic mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_classic.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode STDPAR=ON GPU=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON GPU=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode STDPAR=ON
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make STDPAR=ON -j$(nproc) sn3d exspec

            - name: Compile nebular mode
              run: |
                  cp -v -p artisoptions_nltenebular.h artisoptions.h
                  make clean
                  make -j$(nproc) sn3d exspec
