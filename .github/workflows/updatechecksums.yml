---
name: Update checksums
permissions:
    contents: read
    actions: read
on:
    workflow_dispatch:

jobs:
    updatechecksums:
        runs-on: ubuntu-latest
        steps:
            - name: Check checksum update token
              env:
                  CHECKSUM_PUSH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  if [ -z "$CHECKSUM_PUSH_TOKEN" ]; then
                      echo "::error::The GH_TOKEN organisation secret is not available to this repository. It needs Contents read/write access."
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  # A push authenticated with github.token does not trigger workflows.
                  # Use a separate token so the checksum commit gets normal push checks.
                  # NB: this is the GH_TOKEN *organisation secret*, which is not the same thing as the GH_TOKEN
                  # environment variable that the gh CLI reads in the steps below. Those deliberately keep the
                  # job's own github.token, which is all the read-only API calls there need.
                  token: ${{ secrets.GH_TOKEN }}

            - name: Find latest CI checksums artifact for this branch
              id: findartifact
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.ref_name }}
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  # The artifact does not have to come from the branch head. The operator confirms
                  # that the commits after the artifact's commit do not change the results.
                  # Keep the newest artifact of each commit, newest commits first.
                  candidates=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=checksums&per_page=100" \
                      --jq '[.artifacts[] | select(.workflow_run.head_branch == env.BRANCH and .expired == false)]
                          | group_by(.workflow_run.head_sha) | map(max_by(.created_at)) | sort_by(.created_at) | reverse
                          | .[] | "\(.workflow_run.id)\t\(.workflow_run.head_sha)"')
                  best_run_id=""
                  best_sha=""
                  best_ahead=""
                  while IFS=$'\t' read -r run_id sha; do
                      if [ -z "$run_id" ]; then
                          continue
                      fi
                      # The compare status is "identical" or "ahead" only if the commit is in the
                      # history of the branch head. This rejects a commit that a force-push removed.
                      # ahead_by counts the commits between the artifact's commit and the head.
                      ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...${HEAD_SHA}" \
                          --jq 'select(.status == "identical" or .status == "ahead") | .ahead_by' 2>/dev/null || true)
                      if [ -z "$ahead" ]; then
                          echo "Skip the artifact of run ${run_id}: commit ${sha} is not in the history of ${HEAD_SHA}."
                          continue
                      fi
                      if [ -z "$best_ahead" ] || [ "$ahead" -lt "$best_ahead" ]; then
                          best_run_id="$run_id"
                          best_sha="$sha"
                          best_ahead="$ahead"
                      fi
                      if [ "$ahead" -eq 0 ]; then
                          break
                      fi
                  done <<< "$candidates"
                  if [ -z "$best_run_id" ]; then
                      echo "::error::No unexpired 'checksums' artifact found for any commit in the history of ${HEAD_SHA} on branch ${BRANCH}. Has the CI workflow finished on this branch?"
                      exit 1
                  fi
                  if [ "$best_ahead" -gt 0 ]; then
                      echo "::notice::The checksums come from commit ${best_sha}, which is ${best_ahead} commit(s) behind the branch head ${HEAD_SHA}. This is only correct if the later commits do not change the results."
                  fi
                  echo "Selected run ${best_run_id} of commit ${best_sha}."
                  echo "run_id=${best_run_id}" >> $GITHUB_OUTPUT
                  echo "head_sha=${best_sha}" >> $GITHUB_OUTPUT

            - name: Download and extract checksums artifact
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download ${{ steps.findartifact.outputs.run_id }} --name checksums --dir checksums_artifact
                  for dir in checksums_artifact/*_inputfiles; do
                      cp -v "$dir"/results_md5*.txt "tests/$(basename "$dir")/"
                  done
                  rm -rf checksums_artifact

            - name: Commit and push updated checksums
              run: |
                  git add tests/*_inputfiles/results_md5*.txt
                  if git diff --cached --quiet; then
                      echo "Expected checksums already match the latest CI results. Nothing to commit."
                      exit 0
                  fi
                  git diff --cached --stat
                  git config user.name "github-actions[bot]"
                  git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update expected checksums from CI run of ${{ steps.findartifact.outputs.head_sha }}" \
                      -m "Source: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.findartifact.outputs.run_id }}"
                  git push origin HEAD:${{ github.ref_name }}
