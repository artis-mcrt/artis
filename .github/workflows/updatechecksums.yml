---
name: Update checksums
permissions:
    contents: read
    actions: read
on:
    workflow_dispatch:

jobs:
    updatechecksums:
        runs-on: ubuntu-latest
        steps:
            - name: Check checksum update token
              env:
                  CHECKSUM_PUSH_TOKEN: ${{ secrets.GH_TOKEN }}
              run: |
                  if [ -z "$CHECKSUM_PUSH_TOKEN" ]; then
                      echo "::error::The GH_TOKEN organisation secret is not available to this repository. It needs Contents read/write access."
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  # A push authenticated with github.token does not trigger workflows.
                  # Use a separate token so the checksum commit gets normal push checks.
                  # NB: this is the GH_TOKEN *organisation secret*, which is not the same thing as the GH_TOKEN
                  # environment variable that the gh CLI reads in the steps below. Those deliberately keep the
                  # job's own github.token, which is all the read-only API calls there need.
                  token: ${{ secrets.GH_TOKEN }}

            - name: Find latest CI checksums artifact for this branch
              id: findartifact
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.ref_name }}
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=checksums&per_page=100" \
                      --jq '[.artifacts[] | select(.workflow_run.head_branch == env.BRANCH and .workflow_run.head_sha == env.HEAD_SHA and .expired == false)] | sort_by(.created_at) | last')
                  if [ -z "$artifact" ] || [ "$artifact" = "null" ]; then
                      echo "No unexpired 'checksums' artifact found for commit ${HEAD_SHA} on branch ${BRANCH}."
                      echo "Has the CI workflow finished for the latest commit on this branch? Otherwise this workflow could pick up a stale artifact from an earlier commit and wrongly report that the checksums are unchanged."
                      exit 1
                  fi
                  echo "$artifact" | jq .
                  echo "run_id=$(echo "$artifact" | jq -r '.workflow_run.id')" >> $GITHUB_OUTPUT
                  echo "head_sha=$(echo "$artifact" | jq -r '.workflow_run.head_sha')" >> $GITHUB_OUTPUT

            - name: Download and extract checksums artifact
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh run download ${{ steps.findartifact.outputs.run_id }} --name checksums --dir checksums_artifact
                  for dir in checksums_artifact/*_inputfiles; do
                      cp -v "$dir"/results_md5*.txt "tests/$(basename "$dir")/"
                  done
                  rm -rf checksums_artifact

            - name: Commit and push updated checksums
              run: |
                  git add tests/*_inputfiles/results_md5*.txt
                  if git diff --cached --quiet; then
                      echo "Expected checksums already match the latest CI results. Nothing to commit."
                      exit 0
                  fi
                  git diff --cached --stat
                  git config user.name "github-actions[bot]"
                  git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
                  git commit -m "Update expected checksums from CI run of ${{ steps.findartifact.outputs.head_sha }}" \
                      -m "Source: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.findartifact.outputs.run_id }}"
                  git push origin HEAD:${{ github.ref_name }}
